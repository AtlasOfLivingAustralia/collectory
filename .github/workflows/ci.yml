name: CI

on:
  push:
    branches:
      - master
      - develop
      - '[0-9]+-*'
  pull_request:
    branches:
      - master
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Dhttps.protocols=TLSv1.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Java versions
        run: |
          java -version
          javac -version

      - name: Clean
        run: ./gradlew clean

      - name: Assemble
        run: ./gradlew assemble

      - name: Boot Jar
        run: ./gradlew bootJar

      - name: Publish
        if: github.event_name == 'push'
        run: ./gradlew publish
