version: '3.8'

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: collectory
      POSTGRES_USER: collectory_user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - collectory-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collectory_user -d collectory"]
      interval: 5s
      timeout: 5s
      retries: 5

