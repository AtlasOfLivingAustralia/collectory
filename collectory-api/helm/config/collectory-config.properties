# =============================================================================
# Collectory API — Runtime Configuration
# Rendered by Helm from values.yaml and mounted at:
#   /data/collectory/config/collectory-config.properties
# Loaded via --spring.config.additional-location, so these values override
# the bundled application-prod.properties defaults.
# =============================================================================

# --- Database ---
spring.datasource.url={{ .Values.config.db.url }}
spring.datasource.username={{ .Values.config.db.username }}
spring.datasource.password={{ .Values.config.db.password }}

# --- Server URL ---
collectory.server-url={{ .Values.config.serverUrl }}

# --- Upload ---
collectory.upload-file-path=/data/collectory/upload
collectory.upload-external-url-path={{ .Values.config.uploadExternalUrlPath }}

# --- Repository (entity images / logos) ---
collectory.repository-location-images=/data/collectory/data

# --- Sitemap ---
collectory.sitemap-dir=/data/collectory
collectory.sitemap-enabled={{ .Values.config.sitemapEnabled }}

# --- Charts config ---
collectory.charts-config-path=/data/collectory/config/charts.json

# --- GBIF licence mapping ---
collectory.gbif-licence-mapping-url=file:///data/collectory/config/default-gbif-licence-mapping.json

# --- OIDC / JWT Security ---
security.oidc.enabled={{ .Values.config.security.oidc.enabled }}
security.oidc.discovery-uri={{ .Values.config.security.oidc.discoveryUri }}
security.oidc.client-id={{ .Values.config.security.oidc.clientId }}
security.oidc.secret={{ .Values.config.security.oidc.secret }}
security.oidc.scope={{ .Values.config.security.oidc.scope }}

security.jwt.enabled={{ .Values.config.security.jwt.enabled }}
security.jwt.discovery-uri={{ .Values.config.security.jwt.discoveryUri }}
security.jwt.roles-from-access-token={{ .Values.config.security.jwt.rolesFromAccessToken }}
security.jwt.user-id-claim={{ .Values.config.security.jwt.userIdClaim }}
security.jwt.role-claims={{ .Values.config.security.jwt.roleClaims }}

# --- OIDC config surfaced to the frontend ---
collectory.security.oidc-discovery-uri={{ .Values.config.security.oidc.discoveryUri }}
collectory.security.oidc-client-id={{ .Values.config.security.oidc.clientId }}
collectory.security.oidc-scope={{ .Values.config.security.oidc.scope }}
collectory.security.oidc-logout-url={{ .Values.config.security.oidcLogoutUrl }}

# --- GBIF ---
collectory.gbif-api-url={{ .Values.config.gbif.apiUrl }}
collectory.gbif-website={{ .Values.config.gbif.website }}
collectory.gbif-registration-enabled={{ .Values.config.gbif.registrationEnabled }}
collectory.gbif-registration-dry-run={{ .Values.config.gbif.registrationDryRun }}
collectory.gbif-endorsing-node-key={{ .Values.config.gbif.endorsingNodeKey }}
collectory.gbif-installation-key={{ .Values.config.gbif.installationKey }}
collectory.gbif-api-user={{ .Values.config.gbif.apiUser }}
collectory.gbif-api-password={{ .Values.config.gbif.apiPassword }}
collectory.gbif-orphans-publisher-id={{ .Values.config.gbif.orphansPublisherId }}
collectory.use-gbif-doi={{ .Values.config.gbif.useDoi }}
collectory.gbif-default-entity-country={{ .Values.config.gbif.defaultEntityCountry }}

# --- External Services ---
collectory.biocache-services-url={{ .Values.config.biocacheServicesUrl }}
collectory.biocache-ui-url={{ .Values.config.biocacheUiUrl }}
collectory.logger-url={{ .Values.config.loggerUrl }}
collectory.alerts-url={{ .Values.config.alertsUrl }}
collectory.species-list-tool-url={{ .Values.config.speciesListToolUrl }}
collectory.bie-base-url={{ .Values.config.bieBaseUrl }}
collectory.spatial-base-url={{ .Values.config.spatialBaseUrl }}
collectory.user-details-url={{ .Values.config.userDetailsUrl }}

# --- Header and Footer ---
collectory.header-and-footer.base-url={{ .Values.config.headerAndFooter.baseUrl }}
collectory.header-and-footer.version={{ .Values.config.headerAndFooter.version }}

# --- Skin ---
collectory.skin.layout={{ .Values.config.skin.layout }}
collectory.skin.home-url={{ .Values.config.skin.homeUrl }}
collectory.skin.org-name-long={{ .Values.config.skin.orgNameLong }}
collectory.skin.org-name-short={{ .Values.config.skin.orgNameShort }}
collectory.skin.org-support-email={{ .Values.config.skin.orgSupportEmail }}

# --- Google / Map ---
collectory.google-api-key={{ .Values.config.googleApiKey }}
collectory.mapbox-access-token={{ .Values.config.mapboxAccessToken }}

# --- CORS ---
collectory.cors.enabled={{ .Values.config.cors.enabled }}
collectory.cors.allowed-origins={{ .Values.config.cors.allowedOrigins }}

# --- Sentry ---
sentry.dsn={{ .Values.config.sentry.dsn }}
sentry.environment={{ .Values.config.sentry.environment }}
sentry.traces-sample-rate={{ .Values.config.sentry.tracesSampleRate }}
