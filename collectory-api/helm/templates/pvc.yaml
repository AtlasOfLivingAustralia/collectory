{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ala-collectory.fullname" . }}-data
  labels:
    {{- include "ala-collectory.labels" . | nindent 4 }}
  annotations:
    # Retain the volume if the release is deleted — data must be manually cleaned up.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
