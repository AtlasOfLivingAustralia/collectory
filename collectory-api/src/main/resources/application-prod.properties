# =============================================================================
# Collectory API - Production Profile Overrides
# =============================================================================

# --- Database ---
spring.datasource.url=jdbc:postgresql://localhost:5432/collectory
spring.datasource.username=${DB_USERNAME:collectory_user}
spring.datasource.password=${DB_PASSWORD:}

# --- Connection Pool (production-tuned) ---
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=30000

# --- JPA ---
spring.jpa.show-sql=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

# --- Assets / Storage ---
collectory.assets.storage-path=/data/collectory

# --- Actuator ---
# Expose only the health endpoint — required for Kubernetes liveness/readiness/startup probes.
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# --- Logging ---
logging.level.au.org.ala.collectory=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.root=WARN
