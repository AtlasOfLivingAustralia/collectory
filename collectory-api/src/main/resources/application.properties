# =============================================================================
# Collectory API - Spring Boot Application Properties
# =============================================================================

# --- Server ---
server.port=8080
server.servlet.context-path=/

# --- External Config ---
# Loads legacy Grails-style config; LegacyConfigMapper remaps property names
# to the collectory.* namespace required by AppProperties.
spring.config.import=optional:file:/data/collectory/config/collectory-config.yml,\
  optional:file:/data/collectory/config/collectory-config.properties

# --- CORS ---
collectory.cors.enabled=true
collectory.cors.allowed-origins=*
collectory.cors.allowed-headers=Authorization,Content-Type

# --- Banner / JMX ---
spring.main.banner-mode=off
spring.jmx.unique-names=true

# --- File Upload ---
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# =============================================================================
# Database - PostgreSQL
# =============================================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/collectory
spring.datasource.username=collectory_user
spring.datasource.password=password
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-test-query=SELECT 1

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# =============================================================================
# Spring Security - OIDC / JWT (ALA security libs)
# =============================================================================
security.oidc.enabled=true
security.oidc.discovery-uri=change me
security.oidc.client-id=change me
security.oidc.secret=change me
security.oidc.scope=openid profile email ala roles

security.jwt.enabled=true
security.jwt.discovery-uri=https://cognito-idp.ap-southeast-2.amazonaws.com/ap-southeast-2_OOXU9GW39/.well-known/openid-configuration
security.jwt.roles-from-access-token=true
security.jwt.user-id-claim=username
security.jwt.role-claims=cognito:groups

# =============================================================================
# Collectory Application Config (binds to AppProperties via @ConfigurationProperties)
# All properties below use the 'collectory.' prefix for proper binding.
# =============================================================================

# --- Core ---
collectory.server-url=http://dev.ala.org.au:8080
collectory.project-name=Atlas of Living Australia
collectory.region-name=Australia
collectory.site-default-language=en

# --- Roles ---
collectory.role-admin=ROLE_ADMIN
collectory.role-editor=ROLE_EDITOR
collectory.required-scopes=ala/internal

# --- Upload ---
collectory.upload-file-path=/data/collectory/upload
collectory.upload-external-url-path=http://localhost/upload

# --- Repository ---
collectory.repository-location-images=/data/collectory/data

# --- GBIF ---
collectory.gbif-api-url=https://api.gbif.org/v1/
collectory.gbif-unique-key-term=http://rs.gbif.org/terms/1.0/gbifID
collectory.gbif-website=https://www.gbif-uat.org/
collectory.gbif-default-entity-country=
collectory.gbif-registration-enabled=false
collectory.gbif-endorsing-node-key=XXXXXXXXXXXXXXXX
collectory.gbif-installation-key=XXXXXXXXXXXXXXXX
collectory.gbif-api-user=XXXXXXXXXXXXXXXX
collectory.gbif-api-password=XXXXXXXXXXXXXXXX
collectory.gbif-export-url-base=
collectory.gbif-registration-dry-run=true
collectory.gbif-licence-mapping-url=file:///data/collectory/config/default-gbif-licence-mapping.json
collectory.gbif-orphans-publisher-id=XXXXXXXXXXXXXXXX
collectory.use-gbif-doi=true
collectory.gbif-registration-role=ROLE_ADMIN
collectory.gbif-citations.lookup=https://www.gbif.org/api/resource/search?contentType=literature&gbifDatasetKey=
collectory.gbif-citations.search=https://www.gbif.org/resource/search?contentType=literature&gbifDatasetKey=
collectory.gbif-citations.enabled=true

# --- Skin / Layout ---
collectory.skin.layout=ala-main
collectory.skin.fluid-layout=true
collectory.skin.home-url=http://www.ala.org.au
collectory.skin.org-name-long=Atlas of Living Australia
collectory.skin.org-name-short=Atlas
collectory.skin.org-support-email=support@ala.org.au
collectory.skin.favicon=https://www.ala.org.au/app/uploads/2019/01/cropped-favicon-32x32.png

# --- Header and Footer ---
collectory.header-and-footer.base-url=https://www.test.ala.org.au/commonui-bs5-2019
collectory.header-and-footer.version=2

# --- External Services ---
collectory.logger-url=https://logger.test.ala.org.au/service
collectory.alerts-url=https://alerts-test.ala.org.au
collectory.alert-resource-name=Alerts
collectory.species-list-tool-url=https://lists-test.ala.org.au/speciesListItem/list/
collectory.disable-alert-links=false
collectory.disable-logger-links=false
collectory.biocache-services-url=https://biocache-ws.test.ala.org.au/ws
collectory.biocache-ui-url=https://biocache.ala.org.au
collectory.pipelines-compatible=false

# --- Display ---
collectory.show-extra-info-in-data-sets-view.enabled=false
collectory.show-extra-info-in-data-sets-view.relative-time=false

# --- RIFCS ---
collectory.rifcs-exclude-bounds=true

# --- URL Templates ---
collectory.public-archive-url-template=https://biocache.ala.org.au/archives/gbif/@UID@/@UID@.zip
collectory.gbif-export-url-template=https://biocache.ala.org.au/archives/gbif/@UID@/@UID@.zip
collectory.citation-template=Records provided by @entityName@, accessed through ALA website.
collectory.citation-link-template=For more information: @link@
collectory.citation-rights-template=

# --- EML ---
collectory.eml.organization-name=Atlas of Living Australia
collectory.eml.delivery-point=CSIRO Ecosystems Services
collectory.eml.city=Canberra
collectory.eml.administrative-area=ACT
collectory.eml.postal-code=2601
collectory.eml.country=Australia

# --- Google ---
collectory.google-api-key=TO-BE-ADDED

# --- Map ---
collectory.collections-map-centre-lon=134.0
collectory.collections-map-centre-lat=-28.2
collectory.collections-map-default-zoom=4
collectory.mapbox-access-token=
collectory.cartodb-pattern=https://cartodb-basemaps-{s}.global.ssl.fastly.net/light_all/{z}/{x}/{y}.png

# --- Charts ---
collectory.charts-config-path=/data/collectory/config/charts.json

# --- BIE / Spatial ---
collectory.bie-base-url=https://bie.ala.org.au
collectory.bie-search-path=/search
collectory.spatial-base-url=https://spatial.ala.org.au/

# --- User Details ---
collectory.user-details-url=https://api.test.ala.org.au/userdetails/

# --- Sitemap ---
collectory.sitemap-dir=/data/collectory
collectory.sitemap-enabled=true

# --- OIDC (for frontend config endpoint) ---
collectory.security.oidc-discovery-uri=
collectory.security.oidc-client-id=
collectory.security.oidc-scope=openid profile email ala roles
collectory.security.oidc-logout-url=

# --- List-valued properties ---
collectory.network-types=BCI,CHAH,CHAEC,CHAFC,CHACM

collectory.data-resource.status-list=identified,inProgress,dataAvailable,linksAvailable,declined
collectory.data-resource.resource-type-list=records,website,document,uploads,species-list,publications,events
collectory.data-resource.permissions-document-types=,Email,Data Provider Agreement,Web Page,Other
collectory.data-resource.content-types-list=acoustic recording,authoritative,behaviour,biologging,citizen science,\
  camera trapping,commercial uses,common names,conservation management,conservation status,\
  description,distribution maps,distribution text,feeding and diet,habitat,human interaction,\
  identification keys,images,lifecycle,molecular,movies,pest management,pest status,\
  point occurrence data,population,references,reproduction,scientific names,\
  sensitive species lists,similar species,sound,species interactions,species list,taxonomy,threats
collectory.data-resource.provenance-types-list=Individual sightings,Published dataset,Draft

collectory.collection.collection-types=archival,art,audio,cellcultures,electronic,facsimiles,fossils,\
  genetic,living,observations,preserved,products,seedbank,taxonomic,texts,tissue,visual
collectory.collection.kingdoms=Animalia,Archaebacteria,Eubacteria,Fungi,Plantae,Protista
collectory.collection.development-statuses=Active growth,Closed,Consumable,Decreasing,Lost,Missing,\
  Passive growth,Static

collectory.institution.institution-types=aquarium,archive,botanicGarden,conservation,fieldStation,\
  government,governmentDepartment,herbarium,historicalSociety,horticulturalInstitution,\
  independentExpert,industry,laboratory,library,management,museum,natureEducationCenter,\
  nonUniversityCollege,park,repository,researchInstitute,school,scienceCenter,society,\
  university,voluntaryObserver,zoo

collectory.contacts.titles=Dr,Prof,Mr,Ms,Mrs,Assoc Prof,Assist Prof

# =============================================================================
# OpenAPI / Springdoc
# =============================================================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
openapi.title=Collectory REST services
openapi.description=REST services for interacting with the collectory webapp
openapi.terms=https://www.ala.org.au/terms-of-use
openapi.contact.name=Support
openapi.contact.email=support@ala.org.au
openapi.license.name=Mozilla Public License 1.1
openapi.license.url=https://www.mozilla.org/en-US/MPL/1.1/
openapi.version=@project.version@
openapi.cachetimeoutms=0

# =============================================================================
# Management / Actuator
# =============================================================================
management.endpoints.enabled-by-default=false
