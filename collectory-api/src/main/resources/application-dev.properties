# =============================================================================
# Collectory API - Development Profile Overrides
# =============================================================================

# --- Database ---
spring.datasource.url=jdbc:postgresql://localhost:5432/collectory
spring.datasource.username=collectory_user
spring.datasource.password=password
spring.jpa.show-sql=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# --- GBIF ---
gbifDefaultEntityCountry=AUS

# --- Assets / Storage ---
collectory.assets.storage-path=/data/collectory

# --- Sentry ---
sentry.enabled=false

# --- Logging ---
logging.level.au.org.ala.collectory=DEBUG
logging.level.org.hibernate.SQL=WARN
